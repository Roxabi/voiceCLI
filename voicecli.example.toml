[defaults]
language = "English"
engine = "qwen"
# accent = "Southern drawl"
# personality = "Warm and friendly"
# speed = "Measured pace"
# emotion = "Calm and composed"
# exaggeration = 0.5
# cfg_weight = 0.5
# segment_gap = 200
# crossfade = 50
# plain = false
# chunked = false
# chunk_size = 500

# ── NATS satellite settings ───────────────────────────────────────────────────
# [nats]
# max_cached_engines = 2   # engines to keep hot (LRU cache). Default: 2.
#                          # Per-request engine switching is supported — the satellite
#                          # hot-swaps engines via LRU eviction with VRAM awareness.

# ── Voxtral-specific defaults (also settable via --flow-steps / --cfg-alpha) ──
# flow_steps = 8               # ODE solver steps (3=fast, 8=quality)  [Voxtral]
# cfg_alpha = 1.2              # classifier-free guidance (1.2=quality, 1.0=faster)  [Voxtral]
# temperature = 0.8            # sampling diversity  [Qwen/Chatterbox]
# top_p = 1.0                  # nucleus sampling  [Qwen/Chatterbox]
# min_p = 0.05                 # min probability threshold  [Chatterbox]
# repetition_penalty = 2.0     # repeated token penalty  [Qwen/Chatterbox]

# ── Telegram notifications ─────────────────────────────────────────────────────
# [telegram]
# bot_token = "YOUR_BOT_TOKEN"   # from @BotFather
# chat_id = "YOUR_CHAT_ID"       # your personal chat ID

# ── STT daemon settings ────────────────────────────────────────────────────────
# [stt]
# model = "large-v3-turbo"       # faster-whisper model
# hotkey = "ctrl+space"          # global hotkey for dictate toggle
# hotkey_cancel = "alt+shift+esc"  # cancel active recording
# hotkey_mode = "alt+shift+tab"    # cycle dictation mode
# language = "fr"                # force language for all recordings
# language_detection_threshold = 0.8
# language_detection_segments = 3
# language_fallback = "en"       # fallback if detection confidence is low

# ── STT modes — override built-ins or add your own ────────────────────────────
# Built-in modes: french, english, translate-en, code
# All fields are optional; omit any to inherit the built-in default.

# [stt.modes.french]
# description = "Dictation in French"
# language = "fr"
# prompt = "Bonjour. Voici un texte en français avec une ponctuation correcte."

# [stt.modes.english]
# description = "Dictation in English"
# language = "en"
# prompt = "Hello. Here is a well-punctuated English sentence."

# [stt.modes.translate-en]
# description = "Speak anything, get English output"
# task = "translate"

# [stt.modes.code]
# description = "Voice to code comment"
# prompt = "Variable name, function name, code comment, no filler words."

# Add a custom mode:
