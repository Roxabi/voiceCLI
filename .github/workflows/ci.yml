name: CI
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libcairo2-dev libgirepository-2.0-dev gir1.2-gtk-3.0
      - name: Install dependencies
        run: uv sync --dev --extra nats
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run pyright
      - name: Test
        run: uv run python -m pytest --ignore=tests/test_overlay.py
      - name: Check lyra.* subject literals
        run: ./scripts/check-lyra-literals.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install minimal e2e deps
        # Host only drives docker compose + publishes via NATS client.
        # Satellites install the full voicecli extra inside containers.
        run: uv pip install --system pytest "nats-py>=2.6,<3" "nkeys>=0.1"
      - name: Seed-leak lint
        run: |
          if find tests/e2e/ \( -name '*.seed' -o -name '*.nk' \) | grep .; then
            echo "::error::seed-shaped file committed under tests/e2e/"
            exit 1
          fi
      - name: Run E2E tests
        run: pytest tests/e2e/ -v
      - name: Dump compose logs on failure
        if: failure()
        # Use -p (project name) instead of -f (compose file) so the step
        # doesn't fail on unset fixture env vars (REPO_ROOT/SEED_PATH/etc).
        # The fixture's teardown may have already removed containers — tolerate.
        run: docker compose -p e2e logs || true
      - name: Tear down compose
        if: always()
        run: docker compose -p e2e down -v || true
