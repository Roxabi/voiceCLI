name: CI
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libcairo2-dev libgirepository-2.0-dev gir1.2-gtk-3.0
      - name: Install dependencies
        # --extra all pulls torch/transformers/faster_whisper so pyright resolves
        # imports gated behind opt-in extras (post-#116 ml-base migration).
        run: uv sync --dev --extra all
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run pyright
      - name: Import layer contracts
        run: uv run lint-imports
      - name: Test
        run: uv run python -m pytest
      - name: Check lyra.* subject literals
        run: ./scripts/check-lyra-literals.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install e2e deps
        # The in-process V2 tests (test_*_roundtrip_via_fake_blobstore, #144 T13/T18)
        # import the real synthesize_adapter + transcribe_adapter, which pull
        # roxabi_nats + roxabi_blobs + roxabi_contracts. Installing the editable
        # nats extra is the cleanest way to get the full transitive set in one
        # shot (no torch/whisper bloat — those live in other extras).
        # Original docker tests still work — they only need pytest + the NATS
        # client deps already inside the nats extra.
        run: uv pip install --system pytest -e ".[nats]"
      - name: Seed-leak lint
        run: |
          if find tests/e2e/ \( -name '*.seed' -o -name '*.nk' \) | grep .; then
            echo "::error::seed-shaped file committed under tests/e2e/"
            exit 1
          fi
      - name: Build voicecli-mock image (PR-local)
        # publish.yml only pushes to ghcr on staging push, so PR builds must
        # build the mock image locally and tag it as the staging ref the
        # compose file expects.
        run: docker build -f deploy/Dockerfile.mock -t ghcr.io/roxabi/voicecli-mock:staging .
      - name: Run E2E tests
        run: pytest tests/e2e/ -v
      - name: Dump compose logs on failure
        if: failure()
        # Use -p (project name) instead of -f (compose file) so the step
        # doesn't fail on unset fixture env vars (REPO_ROOT/SEED_PATH/etc).
        # The fixture's teardown may have already removed containers — tolerate.
        run: docker compose -p e2e logs || true
      - name: Tear down compose
        if: always()
        run: docker compose -p e2e down -v || true
