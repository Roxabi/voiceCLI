services:
  nats:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"
    volumes:
      - ${NATS_CONF_PATH}:/etc/nats/nats-server.conf:ro

  voicecli-tts:
    image: python:3.12
    depends_on: [nats]
    working_dir: /app
    entrypoint: ["bash", "-lc"]
    command:
      - >-
        apt-get update -qq
        && apt-get install -y -qq --no-install-recommends portaudio19-dev libportaudio2
        && cp -r /src/. /app
        && pip install uv -q
        && uv sync --extra nats --frozen
        --no-install-package torch
        --no-install-package torchaudio -q
        && uv run --no-sync voicecli nats-serve tts --engine mock
    environment:
      VOICECLI_ENABLE_MOCK_ENGINE: "1"
      NATS_URL: "nats://nats:4222"
      NATS_NKEY_SEED_PATH: /run/secrets/nkey.seed
    volumes:
      - ${REPO_ROOT}:/src:ro
      - ${SEED_PATH}:/run/secrets/nkey.seed:ro
      - uv-cache:/root/.cache/uv

  voicecli-stt:
    image: python:3.12
    depends_on: [nats]
    working_dir: /app
    entrypoint: ["bash", "-lc"]
    command:
      - >-
        apt-get update -qq
        && apt-get install -y -qq --no-install-recommends portaudio19-dev libportaudio2
        && cp -r /src/. /app
        && pip install uv -q
        && uv sync --extra nats --frozen
        --no-install-package torch
        --no-install-package torchaudio -q
        && uv run --no-sync voicecli nats-serve stt --model mock
    environment:
      VOICECLI_ENABLE_MOCK_ENGINE: "1"
      NATS_URL: "nats://nats:4222"
      NATS_NKEY_SEED_PATH: /run/secrets/nkey.seed
    volumes:
      - ${REPO_ROOT}:/src:ro
      - ${SEED_PATH}:/run/secrets/nkey.seed:ro
      - uv-cache:/root/.cache/uv

volumes:
  uv-cache: {}
