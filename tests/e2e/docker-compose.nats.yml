services:
  nats:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"
    volumes:
      - ${NATS_CONF_PATH}:/etc/nats/nats-server.conf:ro

  voicecli-tts:
    image: ghcr.io/roxabi/voicecli-mock:staging
    depends_on: [nats]
    environment:
      VOICECLI_ENABLE_MOCK_ENGINE: "1"
      NATS_URL: "nats://nats:4222"
      NATS_NKEY_SEED_PATH: /run/secrets/nkey.seed
    volumes:
      - ${SEED_PATH}:/run/secrets/nkey.seed:ro
    entrypoint: ["voicecli", "nats-serve", "tts", "--engine", "mock"]

  voicecli-stt:
    image: ghcr.io/roxabi/voicecli-mock:staging
    depends_on: [nats]
    environment:
      VOICECLI_ENABLE_MOCK_ENGINE: "1"
      NATS_URL: "nats://nats:4222"
      NATS_NKEY_SEED_PATH: /run/secrets/nkey.seed
    volumes:
      - ${SEED_PATH}:/run/secrets/nkey.seed:ro
    entrypoint: ["voicecli", "nats-serve", "stt", "--model", "mock"]
