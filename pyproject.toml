[project]
license = { text = "AGPL-3.0-or-later" }
name = "voicecli"
version = "0.2.2"
description = "Unified CLI for voice generation — Qwen3-TTS & Chatterbox backends"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "soundfile",
    "lameenc>=1.7",
    "pyaudio>=0.2.14",
    "transformers>=4.57.6",
]

[project.scripts]
voicecli = "voicecli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicecli"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".claude/"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv]
override-dependencies = [
    "torch>=2.7",
    "torchaudio>=2.7",
    # chatterbox pins transformers==4.46.3, qwen-tts pins ==4.57.3; 5.x breaks qwen_tts
    "transformers>=4.57.3,<5",
    # chatterbox pins numpy<1.26.0 which doesn't build on Python 3.12
    "numpy>=1.26",
    # pandas 2.1.0 doesn't build on 3.12, gradio pulls it in
    "pandas>=2.2",
    # ml-dtypes/onnx need numpy 2.x compat builds
    "ml-dtypes>=0.5",
    "onnx>=1.20",
]

[tool.uv.extra-build-dependencies]
pkuseg = ["numpy"]

[tool.uv.sources]
voxtral-tts = { git = "https://github.com/Roxabi/voxtral-tts.git", branch = "main" }
roxabi-satellite = { git = "https://github.com/Roxabi/roxabi-factory.git", subdirectory = "packages/roxabi-satellite", branch = "feat/roxabi-satellite" }

[tool.pytest.ini_options]
# src layout: expose src/ to pytest without relying on editable install
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
tts = [
    "qwen-tts",
    "faster-qwen3-tts",
    "chatterbox-tts",
    "torch>=2.7",
    "torchaudio>=2.7",
]
stt = [
    "faster-whisper>=1.2",
    "torch>=2.7",
    "torchaudio>=2.7",
]
all = ["voicecli[tts,stt,nats]"]
voxtral = ["voxtral-tts[int4]", "scipy"]
hotkey = ["pynput>=1.7"]
overlay = ["PyGObject>=3.42", "pycairo>=1.25"]
nats = [
    "roxabi-satellite",
    "nats-py>=2.6,<3",
    "nkeys>=0.1",
    "nvidia-ml-py>=12,<14",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pre-commit>=4.5.1",
    "pip-licenses>=5.5.1",
    "pyright>=1.1.408",
    "import-linter>=2.0,<3.0",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
]
