[program:voicecli_tts]
command=%(ENV_HOME)s/projects/voiceCLI/supervisor/scripts/run_voicecli.sh tts
directory=%(ENV_HOME)s/projects/voiceCLI
# DEPRECATED — supervisord voicecli path retired by big-bang NATS consolidation; see ecosystem runbook. Kept temporarily for rollback.
environment=HOME="%(ENV_HOME)s",PATH="%(ENV_HOME)s/.local/bin:%(ENV_HOME)s/projects/voiceCLI/.venv/bin:/usr/local/bin:/usr/bin:/bin",NATS_URL="nats://127.0.0.1:4222",NATS_NKEY_SEED_PATH="%(ENV_HOME)s/.voicecli/nkeys/voice-tts.seed"
autostart=false
autorestart=unexpected
exitcodes=0,3,78,79
# startsecs: Chatterbox multilingual model load may need this raised to 15 on
# first boot if the disk cache is cold — re-tune per measurement.
startsecs=10
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_HOME)s/.local/state/voicecli/logs/voicecli_tts.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile=%(ENV_HOME)s/.local/state/voicecli/logs/voicecli_tts_error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
