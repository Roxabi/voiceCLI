# .claude/stack.yml — dev-core stack configuration
schema_version: "1.0"

runtime: python
package_manager: uv

backend:
  framework: typer
  path: src/voicecli

docs:
  framework: none
  path: docs
  format: md

build:
  formatter: ruff
  formatter_config: pyproject.toml
  formatter_fix_cmd: "uv run ruff format . && uv run ruff check --fix ."

testing:
  unit: pytest

lsp:
  enabled: true
  server: pyright

deploy:
  platform: quadlet

commands:
  dev: uv run voicecli
  test: uv run pytest
  lint: uv run ruff check .
  format: uv run ruff format .
  typecheck: uv run pyright
  install: uv sync

artifacts:
  analyses: artifacts/analyses
  specs: artifacts/specs
  frames: artifacts/frames
  plans: artifacts/plans

standards:
  backend: docs/standards/backend-patterns.md
  testing: docs/standards/testing.md
  code_review: docs/standards/code-review.md
  architecture: docs/architecture/
  configuration: docs/configuration.md
  contributing: docs/contributing.md

quality_gates:
  file_length:
    enabled: true
    metric: sloc
    max_lines: 300
    exemptions_file: tools/file_exemptions.txt
  folder_size:
    enabled: true
    max_files: 12
    exemptions_file: tools/folder_exemptions.txt
  import_layers:
    enabled: true
    stage: pre-push
  duplicate_test_basenames:
    enabled: true
    script: tools/check_duplicate_test_basenames.sh
    source: pyproject.toml [tool.pytest.ini_options].testpaths
  quadlet_manifest_install:
    enabled: true
    stage: pre-push
    script: tools/check_quadlet_manifest_install.sh
    description: bidirectional manifest↔install — every [component.*] container in deploy/quadlet.toml has a source file installed by the deploy/quadlet/*.container glob (Makefile + install.sh), and every on-disk *.container is declared (orphan-install guard, #1901). Also enforced in CI via quadlet-lint.yml.
