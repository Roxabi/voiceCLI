[meta]
tool = "voicecli"
uid = 1501

[component.stt]
container = "voicecli-stt.container"
required_secrets = ["voicecli-nats-stt"]
env_file = "~/.roxabi/voicecli/env/stt.env"
host_roles = ["voice-worker"]

[component.tts]
container = "voicecli-tts.container"
required_secrets = ["voicecli-nats-tts"]
env_file = "~/.roxabi/voicecli/env/tts.env"
host_roles = ["voice-worker"]

[secrets]
# Bind-mounted from factory SSoT — see deploy/quadlet/voicecli-{stt,tts}.container
blobstore_bearer_token = { env_var = "BLOBSTORE_BEARER_TOKEN_PATH", host_path = "~/.roxabi/factory/blobstore.tok" }
