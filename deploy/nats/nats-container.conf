# NATS Server — voiceCLI (container)
# Used by: deploy/quadlet/voicecli-nats.container
# Snapshotted from: lyra@01157b1 (deploy/nats/nats-container.conf)
# Re-sync manually if Lyra upstream changes materially; no automatic drift check.
#
# Differences from a host nats.conf:
#   - Listens on 0.0.0.0 — worker containers connect via voicecli.network
#   - No TLS — internal container network, no external exposure
#   - No pid_file — not applicable inside a container

# Bind to all interfaces so worker containers can reach NATS via
# the voicecli bridge network (nats://voicecli-nats:4222).
port: 4222

# ── nkey auth ──────────────────────────────────────────────────────────────
# auth.conf (public keys only) is delivered as a Podman secret mounted at
# /etc/nats/nkeys/auth.conf. Seeds live on the host at ~/.voicecli/nkeys/ and
# are delivered to worker containers as separate per-worker Podman secrets.
#
# Relative include keeps the config portable — it resolves against the mount
# point (/etc/nats/), matching where the Podman secret is mounted. Absolute
# paths also work but would hardcode the container mount layout twice.
include "nkeys/auth.conf"

# ── Resource limits ────────────────────────────────────────────────────────
max_connections: 20       # NATS + 2 workers + headroom
max_payload:     52428800 # 50 MB — audio payloads

logtime: true
